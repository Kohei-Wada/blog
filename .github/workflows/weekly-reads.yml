name: 📈 Weekly Reads Update

on:
  schedule:
    # Mondays 23:30 JST (14:30 UTC), ahead of the 00:00 JST daily build
    - cron: '30 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Fetch per-post reads from GA4
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Write GA4 service account key
        env:
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$GA4_SERVICE_ACCOUNT_KEY" ]; then
            echo "GA4_SERVICE_ACCOUNT_KEY secret is not configured" >&2
            exit 1
          fi
          printf '%s' "$GA4_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/ga4-key.json"

      - name: Fetch reads
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/ga4-key.json
        run: node scripts/fetch-reads.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/reads.json; then
            echo "reads.json unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/reads.json
          git commit -m 'chore(reads): weekly GA4 reads update'
          git push
