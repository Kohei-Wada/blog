<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Noto Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#586e75"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b58900"/>
    </marker>
  </defs>
  <rect width="800" height="560" rx="14" fill="#fdf6e3"/>

  <!-- main loop edges -->
  <g stroke="#586e75" stroke-width="2.2" fill="none" marker-end="url(#a)">
    <path d="M462,82 Q600,95 640,168"/>
    <path d="M660,232 Q672,330 600,404"/>
    <path d="M500,452 L300,452"/>
    <path d="M200,404 Q128,330 140,232"/>
    <path d="M160,168 Q200,95 338,82"/>
  </g>

  <!-- knowledge side path -->
  <g stroke="#b58900" stroke-width="2" fill="none">
    <path d="M610,232 Q520,255 478,268" marker-end="url(#k)"/>
    <path d="M360,318 Q300,370 268,404" marker-end="url(#k)"/>
    <path d="M400,236 L400,112" stroke-dasharray="6 5" marker-end="url(#k)"/>
  </g>

  <!-- nodes -->
  <g font-size="19" font-weight="700" fill="#073642" text-anchor="middle">
    <rect x="338" y="52" width="124" height="54" rx="10" fill="#eee8d5" stroke="#586e75" stroke-width="2"/>
    <text x="400" y="86">Use</text>
    <rect x="590" y="172" width="136" height="54" rx="10" fill="#eee8d5" stroke="#586e75" stroke-width="2"/>
    <text x="658" y="206">Feedback</text>
    <rect x="500" y="408" width="136" height="54" rx="10" fill="#eee8d5" stroke="#586e75" stroke-width="2"/>
    <text x="568" y="442">Accept</text>
    <rect x="164" y="408" width="136" height="54" rx="10" fill="#eee8d5" stroke="#586e75" stroke-width="2"/>
    <text x="232" y="442">Fix</text>
    <rect x="74" y="172" width="136" height="54" rx="10" fill="#eee8d5" stroke="#586e75" stroke-width="2"/>
    <text x="142" y="206">Delivered</text>
  </g>

  <!-- knowledge node -->
  <rect x="318" y="240" width="164" height="76" rx="38" fill="#fdf0c8" stroke="#b58900" stroke-width="2"/>
  <text x="400" y="272" font-size="18" font-weight="700" fill="#073642" text-anchor="middle">knowledge</text>
  <text x="400" y="296" font-size="13" fill="#586e75" text-anchor="middle">one place · flat · git</text>

  <!-- main loop labels (friction being cut) -->
  <g font-size="14" fill="#268bd2" text-anchor="middle">
    <text x="704" y="118">more people can give it</text>
    <text x="704" y="136">cheaper to give</text>
    <text x="712" y="318">CI stops</text>
    <text x="712" y="336">breakage</text>
    <text x="400" y="484">knowledge kept apart, structure holds</text>
    <text x="88" y="318">plugin +</text>
    <text x="88" y="336">auto update</text>
    <text x="96" y="118">everyone runs</text>
    <text x="96" y="136">the same skill</text>
  </g>

  <!-- knowledge labels -->
  <g font-size="13" fill="#b58900" text-anchor="middle">
    <text x="560" y="276">piles up</text>
    <text x="226" y="350">common parts</text>
    <text x="226" y="366">become skills</text>
    <text x="470" y="170">cheaper to find</text>
  </g>

  <text x="400" y="534" font-size="13" fill="#586e75" text-anchor="middle">blue = friction being cut  /  work logs are recorded automatically, not by willpower</text>
</svg>
